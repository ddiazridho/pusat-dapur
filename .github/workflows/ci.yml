# Gate PR (docs/tasks.md → PR Gate). Aktif sejak #1a: lint, typecheck, unit, build.
# Integrasi (supabase start + migrate deploy + test:int) otomatis aktif begitu
# prisma/schema.prisma ada (#2). Langkah lanjutan (test:http #4, E2E #5, bundle budget #13)
# ditambahkan Agent A pada issue terkait. CI tidak pernah menyentuh Supabase dev/prod.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Deteksi tahap proyek
        id: tahap
        run: |
          echo "app=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "db=$([ -f prisma/schema.prisma ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Belum ada package.json (sebelum #1a)
        if: steps.tahap.outputs.app != 'true'
        run: echo "Scaffold aplikasi belum ada; lint & test dilewati."

      - uses: pnpm/action-setup@v4
        if: steps.tahap.outputs.app == 'true'

      - uses: actions/setup-node@v4
        if: steps.tahap.outputs.app == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.tahap.outputs.app == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.tahap.outputs.app == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.tahap.outputs.app == 'true'
        run: pnpm typecheck

      - name: Unit test
        if: steps.tahap.outputs.app == 'true'
        run: pnpm test

      - name: Supabase lokal (Postgres, Auth)
        if: steps.tahap.outputs.db == 'true'
        run: pnpm exec supabase start

      - name: Migrasi ke Postgres lokal
        if: steps.tahap.outputs.db == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm exec prisma migrate deploy

      - name: Integration test
        if: steps.tahap.outputs.db == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm test:int

      # Nilai placeholder non-rahasia (Supabase CLI lokal) agar validasi env di next.config.ts
      # lolos; build tidak menghubungi database maupun Supabase.
      - name: Build
        if: steps.tahap.outputs.app == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          SUPABASE_SECRET_KEY: ci-placeholder
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          APP_URL: http://localhost:3000
        run: pnpm build
